baseURL = 'https://www.nimma.codes'
locale = 'nl-NL'
defaultContentLanguage = 'nl'
title = 'Nimma.codes'
theme = "nimma-codes"
disableKinds = ['taxonomy', 'term', 'section', 'RSS']
[params]
  github_source = 'https://github.com/nimma-codes/www.nimma.codes'
  description = 'Een cross-language user group voor software developers in de regio Arnhem-Nijmegen'
[params.links]
  meetup = 'https://www.meetup.com/nimma-codes-meetup-group/'
  photos = 'https://www.meetup.com/nimma-codes-meetup-group/photos/'
  discord = 'https://discord.gg/XN6P9X3WKj'
  github = 'https://github.com/nimma-codes'
  talks = 'https://github.com/nimma-codes/talks/issues'
  email = 'info@nimma.codes'
[params.meetup]
  # Openbare iCal-feed van de groep; zie docs/adr/0001-hugo-en-meetup-feed.md
  ical = 'https://www.meetup.com/nimma-codes-meetup-group/events/ical/'
[markup.goldmark.renderer]
  # De Code of Conduct gebruikt HTML voor de wel/niet-lijsten en de handhavingsladder
  unsafe = true
